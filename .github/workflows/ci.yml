name: Test CI/CD Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v6

      - name: installer nodejs
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: build frontend
        run: |
          cd ./frontend
          npm ci
          npm run build

